<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form 태그 테스트</title>
  </head>
  <body>
    <h2>폼 요소 살펴보기</h2>

    <!-- Log in box -->
    <form>
      <h5>로그인 해주세요</h5>
      <div>
        ID:
        <input
          type="text"
          name="userid"
          placeholder="ID를 입력하세요"
          required
        />
      </div>
      <div>
        PSWD:
        <input
          type="password"
          name="pswd"
          placeholder="PSWD를 입력하세요"
          required
        />
      </div>
      <input type="submit" value="로그인" />
    </form>
    <!-- 체크박스 만들기 -->
    <form>
      <h5>개발환경 설치</h5>
      <input id="vscode" type="checkbox" name="setup" value="vscode" />
      <lable for="vscode"> vs code 설치 </lable>
      <input id="node" type="checkbox" name="setup" value="node" />
      <lable for="node">Node 설치</lable>
      <input id="git" type="checkbox" name="setup" value="git" />
      <lable for="git"> Git 설치</lable>
      <input id="claude" type="checkbox" name="setup" value="claude" />
      <lable for="claude">클로드 code 설치</lable>

      <!-- 라디오 버튼 -->
      <h5>강의 난이도</h5>
      <input id="entry" type="radio" name="level" value="entry" />
      <lable for="entry"> 입문 </lable>
      <input id="middle" type="radio" name="level" value="middle" />
      <lable for="middle"> 중급</lable>
      <input id="high" type="radio" name="level" value="high" />
      <lable for="high"> 고급 </lable>
    </form>
  </body>
</html>
